name: Build Git DMG (macOS Intel)

on:
  workflow_dispatch:
    inputs:
      git_version:
        description: "גרסת Git לבנייה (השאר ריק = הגרסה היציבה האחרונה)"
        required: false
        default: ""
  schedule:
    # פעם בחודש, ב-1 לחודש ב-04:00 UTC
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:
  build:
    # macos-13 הוסר בדצמבר 2025.
    # macos-15-intel הוא הראנר האינטלי (x86_64) האחרון שנתמך (עד אוגוסט 2027).
    runs-on: macos-15-intel

    env:
      # קריטי: מבטיח שהבינארי ירוץ גם על Ventura 13.x ולא רק על ה-SDK של הראנר
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      PREFIX: /usr/local/git
      PKG_IDENTIFIER: com.local.git

    steps:
      - name: זיהוי גרסת Git היציבה האחרונה
        id: ver
        run: |
          set -euo pipefail
          IN="${{ github.event.inputs.git_version }}"
          if [ -n "$IN" ]; then
            VER="${IN#v}"
          else
            VER=$(curl -fsSL "https://api.github.com/repos/git/git/tags?per_page=100" \
              | jq -r '.[].name' \
              | sed 's/^v//' \
              | grep -Ev 'rc|-' \
              | sort -V | tail -n1)
          fi
          [ -n "$VER" ] || { echo "לא הצלחתי לזהות גרסה"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "בונה את Git $VER"

      - name: הורדת קוד המקור
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          curl -fsSLO "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${VER}.tar.xz"
          tar -xf "git-${VER}.tar.xz"
          ls -d "git-${VER}"

      - name: קימפול
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          cd "git-${VER}"
          make -j"$(sysctl -n hw.ncpu)" \
            prefix="$PREFIX" \
            CFLAGS="-O2 -arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            LDFLAGS="-arch x86_64 -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            NO_GETTEXT=YesPlease \
            NO_TCLTK=YesPlease \
            NO_PERL_CPAN_FALLBACKS=YesPlease \
            all

      - name: התקנה לתוך payload
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          cd "git-${VER}"
          make prefix="$PREFIX" \
            NO_GETTEXT=YesPlease NO_TCLTK=YesPlease \
            DESTDIR="${GITHUB_WORKSPACE}/payload" install

      - name: בדיקת שפיות של הבינארי
        run: |
          set -euo pipefail
          BIN="${GITHUB_WORKSPACE}/payload${PREFIX}/bin/git"
          file "$BIN"
          file "$BIN" | grep -q "x86_64" || { echo "שגיאה: הבינארי אינו x86_64"; exit 1; }
          # ודא שאין תלות בספריות Homebrew (/opt/homebrew או /usr/local/opt)
          if otool -L "$BIN" | grep -Eq "/opt/homebrew|/usr/local/opt"; then
            echo "שגיאה: נמצאה תלות ב-Homebrew, הבינארי לא יעבוד במכונת היעד"
            otool -L "$BIN"
            exit 1
          fi
          otool -L "$BIN"
          "$BIN" --version

      - name: יצירת סקריפט postinstall
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/postinstall <<'EOS'
          #!/bin/bash
          set -e
          mkdir -p /etc/paths.d /etc/manpaths.d /usr/local/bin
          echo "/usr/local/git/bin"       > /etc/paths.d/git
          echo "/usr/local/git/share/man" > /etc/manpaths.d/git
          # סימלינקים ל-/usr/local/bin, שקודם ל-/usr/bin ב-PATH.
          # בלי זה, /usr/bin/git (ה-stub של Apple) גובר על ההתקנה.
          for f in /usr/local/git/bin/*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "/usr/local/bin/$(basename "$f")"
          done
          exit 0
          EOS
          chmod +x scripts/postinstall

      - name: אריזה ל-PKG
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dmgroot
          pkgbuild \
            --root payload \
            --scripts scripts \
            --identifier "$PKG_IDENTIFIER" \
            --version "$VER" \
            --install-location / \
            "dmgroot/Git-${VER}-intel.pkg"

      - name: יצירת DMG
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          cat > dmgroot/README.txt <<EOS
          Git ${VER} — התקנה עבור macOS (Intel / x86_64)
          נבנה עבור macOS 13 (Ventura) ומעלה.

          התקנה:
          1. לחצו לחיצה ימנית על קובץ ה-PKG ובחרו "Open" (לא לחיצה כפולה),
             מכיוון שההתקנה אינה חתומה דיגיטלית ע"י Apple.
          2. אשרו את האזהרה ועברו את שלבי ההתקנה.
          3. פתחו חלון טרמינל חדש והריצו:
                which -a git
             הפלט הראשון צריך להיות /usr/local/bin/git
                git --version

          הסרה:
             sudo rm -rf /usr/local/git /etc/paths.d/git /etc/manpaths.d/git
             sudo find /usr/local/bin -type l -lname '/usr/local/git/*' -delete
          EOS
          hdiutil create \
            -volname "Git ${VER}" \
            -srcfolder dmgroot \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "Git-${VER}-intel.dmg"
          shasum -a 256 "Git-${VER}-intel.dmg" > "Git-${VER}-intel.dmg.sha256"

      - name: העלאת Artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-dmg-${{ steps.ver.outputs.version }}
          path: |
            Git-*.dmg
            Git-*.dmg.sha256
          if-no-files-found: error

      - name: פרסום Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: git-${{ steps.ver.outputs.version }}
          name: Git ${{ steps.ver.outputs.version }} (macOS Intel)
          files: |
            Git-*.dmg
            Git-*.dmg.sha256
