name: Download URL to Artifact

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the file to download"
        required: true
        type: string

      filename:
        description: "Filename to save as"
        required: false
        default: "downloaded-file"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        run: |
          curl -L \
            --fail \
            --retry 3 \
            "${{ inputs.url }}" \
            -o "${{ inputs.filename }}"
      - name: Show file info
        run: |
          ls -lh "${{ inputs.filename }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ inputs.filename }}
          
          retention-days: 30
