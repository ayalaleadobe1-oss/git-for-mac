name: Build Latest Git DMG for Intel Mac

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: build-latest-git-intel
  cancel-in-progress: false

jobs:
  version:
    name: Find latest stable Git version
    runs-on: ubuntu-latest

    outputs:
      git_tag: ${{ steps.git_version.outputs.git_tag }}
      git_version: ${{ steps.git_version.outputs.git_version }}
      release_tag: ${{ steps.git_version.outputs.release_tag }}

    steps:
      - name: Find latest stable tag
        id: git_version
        shell: bash
        run: |
          set -euo pipefail

          GIT_TAG="$(
            git ls-remote --tags --refs https://github.com/git/git.git \
              | awk -F/ '{print $3}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$GIT_TAG" ]]; then
            echo "::error::Could not find the latest stable Git tag."
            exit 1
          fi

          GIT_VERSION="${GIT_TAG#v}"
          RELEASE_TAG="git-${GIT_VERSION}-macos-intel"

          echo "Latest Git tag: $GIT_TAG"
          echo "Git version: $GIT_VERSION"

          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
          echo "git_version=$GIT_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build Intel PKG and DMG
    needs: version
    runs-on: macos-15-intel

    env:
      GIT_TAG: ${{ needs.version.outputs.git_tag }}
      GIT_VERSION: ${{ needs.version.outputs.git_version }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      INSTALL_PREFIX: /usr/local

      SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check Intel runner
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          xcodebuild -version

          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::Expected an Intel x86_64 runner."
            exit 1
          fi

      - name: Prepare working directories
        shell: bash
        run: |
          set -euo pipefail

          echo "SOURCE_DIR=$RUNNER_TEMP/git-source" >> "$GITHUB_ENV"
          echo "PACKAGE_ROOT=$RUNNER_TEMP/git-package-root" >> "$GITHUB_ENV"
          echo "PACKAGE_SCRIPTS=$RUNNER_TEMP/git-package-scripts" >> "$GITHUB_ENV"
          echo "DMG_CONTENTS=$RUNNER_TEMP/git-dmg-contents" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/git-signing.keychain-db" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$GITHUB_WORKSPACE/output" >> "$GITHUB_ENV"

          rm -rf \
            "$RUNNER_TEMP/git-source" \
            "$RUNNER_TEMP/git-package-root" \
            "$RUNNER_TEMP/git-package-scripts" \
            "$RUNNER_TEMP/git-dmg-contents" \
            "$GITHUB_WORKSPACE/output"

          mkdir -p \
            "$RUNNER_TEMP/git-package-root" \
            "$RUNNER_TEMP/git-package-scripts" \
            "$RUNNER_TEMP/git-dmg-contents" \
            "$GITHUB_WORKSPACE/output"

      - name: Download official Git source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$GIT_TAG" \
            https://github.com/git/git.git \
            "$SOURCE_DIR"

          cd "$SOURCE_DIR"

          DOWNLOADED_TAG="$(git describe --tags --exact-match)"

          if [[ "$DOWNLOADED_TAG" != "$GIT_TAG" ]]; then
            echo "::error::Downloaded $DOWNLOADED_TAG instead of $GIT_TAG."
            exit 1
          fi

       - name: Build Git for Intel macOS Ventura or newer
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"
          export MACOSX_DEPLOYMENT_TARGET

          CPU_COUNT="$(sysctl -n hw.logicalcpu)"

          make -j"$CPU_COUNT" \
            prefix="$INSTALL_PREFIX" \
            NO_GETTEXT=YesPlease \
            NO_TCLTK=YesPlease \
            NO_PERL=YesPlease \
            NO_PYTHON=YesPlease \
            NO_HOMEBREW=YesPlease \
            NO_FINK=YesPlease \
            NO_DARWIN_PORTS=YesPlease \
            NO_OPENSSL=YesPlease \
            NO_RUST=YesPlease

      - name: Install Git into package staging directory
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"
          export MACOSX_DEPLOYMENT_TARGET

          make \
            prefix="$INSTALL_PREFIX" \
            DESTDIR="$PACKAGE_ROOT" \
            NO_GETTEXT=YesPlease \
            NO_TCLTK=YesPlease \
            NO_PERL=YesPlease \
            NO_PYTHON=YesPlease \
            NO_HOMEBREW=YesPlease \
            NO_FINK=YesPlease \
            NO_DARWIN_PORTS=YesPlease \
            NO_OPENSSL=YesPlease \
            NO_RUST=YesPlease \
            install

          GIT_BINARY="$PACKAGE_ROOT/usr/local/bin/git"

          if [[ ! -x "$GIT_BINARY" ]]; then
            echo "::error::Git was not installed into the staging directory."
            exit 1
          fi

          "$GIT_BINARY" --version
          file "$GIT_BINARY"

          if ! file "$GIT_BINARY" | grep -q 'x86_64'; then
            echo "::error::The generated Git binary is not Intel x86_64."
            exit 1
          fi

          "$GIT_BINARY" --version
          file "$GIT_BINARY"

          if ! file "$GIT_BINARY" | grep -q 'x86_64'; then
            echo "::error::The generated Git binary is not Intel x86_64."
            exit 1
          fi

      - name: Verify deployment target and linked libraries
        shell: bash
        run: |
          set -euo pipefail

          FOUND_MACHO=false

          while IFS= read -r -d '' FILE_PATH; do
            if file -b "$FILE_PATH" | grep -q 'Mach-O'; then
              FOUND_MACHO=true
              echo "Checking: $FILE_PATH"
              xcrun vtool -show-build "$FILE_PATH" || true
              otool -L "$FILE_PATH"

              if otool -L "$FILE_PATH" | grep -E '/opt/homebrew|/usr/local/(Cellar|opt)/'; then
                echo "::error::A packaged binary links to a Homebrew library: $FILE_PATH"
                exit 1
              fi
            fi
          done < <(find "$PACKAGE_ROOT" -type f -print0)

          if [[ "$FOUND_MACHO" != "true" ]]; then
            echo "::error::No Mach-O files were found in the package."
            exit 1
          fi

      - name: Create post-install script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$PACKAGE_SCRIPTS/postinstall" <<'SCRIPT'
          #!/bin/bash
          set -e

          echo "/usr/local/bin" > /etc/paths.d/git-custom
          chown root:wheel /etc/paths.d/git-custom
          chmod 644 /etc/paths.d/git-custom

          exit 0
          SCRIPT

          chmod 755 "$PACKAGE_SCRIPTS/postinstall"

      - name: Check whether signing is configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_VALUES=(
            "$SIGNING_CERTIFICATE_BASE64"
            "$SIGNING_CERTIFICATE_PASSWORD"
            "$KEYCHAIN_PASSWORD"
            "$DEVELOPER_ID_APPLICATION"
            "$DEVELOPER_ID_INSTALLER"
            "$APPLE_ID"
            "$APPLE_TEAM_ID"
            "$APPLE_APP_PASSWORD"
          )

          ENABLED=true

          for VALUE in "${REQUIRED_VALUES[@]}"; do
            if [[ -z "$VALUE" ]]; then
              ENABLED=false
              break
            fi
          done

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

          if [[ "$ENABLED" == "true" ]]; then
            echo "Signing and notarization are enabled."
          else
            echo "::warning::Signing secrets are incomplete. An unsigned DMG will be created."
          fi

      - name: Import Apple signing certificates
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/apple-signing-certificates.p12"

          printf '%s' "$SIGNING_CERTIFICATE_BASE64" \
            | base64 -D \
            > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v "$KEYCHAIN_PATH"

      - name: Sign packaged Mach-O files
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' FILE_PATH; do
            if file -b "$FILE_PATH" | grep -q 'Mach-O'; then
              echo "Signing $FILE_PATH"

              codesign \
                --force \
                --timestamp \
                --options runtime \
                --sign "$DEVELOPER_ID_APPLICATION" \
                "$FILE_PATH"

              codesign --verify --strict --verbose=2 "$FILE_PATH"
            fi
          done < <(find "$PACKAGE_ROOT" -type f -print0)

      - name: Build unsigned PKG
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_PKG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel-unsigned.pkg"

          pkgbuild \
            --root "$PACKAGE_ROOT" \
            --scripts "$PACKAGE_SCRIPTS" \
            --identifier "org.git-scm.git.custom.intel" \
            --version "$GIT_VERSION" \
            --install-location / \
            --ownership recommended \
            "$UNSIGNED_PKG"

          pkgutil --payload-files "$UNSIGNED_PKG" | head -100

      - name: Sign PKG
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_PKG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel-unsigned.pkg"
          FINAL_PKG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel.pkg"

          productsign \
            --sign "$DEVELOPER_ID_INSTALLER" \
            "$UNSIGNED_PKG" \
            "$FINAL_PKG"

          rm -f "$UNSIGNED_PKG"
          pkgutil --check-signature "$FINAL_PKG"

      - name: Keep unsigned PKG when signing is not configured
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mv \
            "$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel-unsigned.pkg" \
            "$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel.pkg"

      - name: Notarize and staple PKG
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          FINAL_PKG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel.pkg"

          xcrun notarytool submit "$FINAL_PKG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$FINAL_PKG"
          xcrun stapler validate "$FINAL_PKG"
          spctl --assess --type install --verbose=4 "$FINAL_PKG"

      - name: Verify final PKG payload
        shell: bash
        run: |
          set -euo pipefail

          FINAL_PKG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel.pkg"

          if ! pkgutil --payload-files "$FINAL_PKG" | grep -q 'usr/local/bin/git$'; then
            echo "::error::The final PKG does not contain usr/local/bin/git."
            exit 1
          fi

          "$PACKAGE_ROOT/usr/local/bin/git" --version

      - name: Create DMG contents
        shell: bash
        run: |
          set -euo pipefail

          FINAL_PKG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel.pkg"
          cp "$FINAL_PKG" "$DMG_CONTENTS/"

          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            SIGNING_STATUS="Digitally signed and notarized by Apple."
          else
            SIGNING_STATUS="Unsigned and not notarized. macOS may display a security warning."
          fi

          cat > "$DMG_CONTENTS/README.txt" <<EOF
          Git ${GIT_VERSION} for Intel Mac
          =================================

          Architecture: Intel x86_64
          Minimum target: macOS Ventura 13.0

          Installation:
          1. Open Git-${GIT_VERSION}-macOS-Intel.pkg
          2. Complete the installer
          3. Close and reopen Terminal
          4. Run: git --version

          Git is installed in:
          /usr/local/bin/git

          Signing status:
          ${SIGNING_STATUS}

          Official source tag:
          https://github.com/git/git/tree/${GIT_TAG}
          EOF

      - name: Create compressed DMG
        shell: bash
        run: |
          set -euo pipefail

          FINAL_DMG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel.dmg"

          hdiutil create \
            -volname "Git ${GIT_VERSION} Intel" \
            -srcfolder "$DMG_CONTENTS" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            "$FINAL_DMG"

          hdiutil verify "$FINAL_DMG"

      - name: Sign, notarize, and staple DMG
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          FINAL_DMG="$OUTPUT_DIR/Git-${GIT_VERSION}-macOS-Intel.dmg"

          codesign \
            --force \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$FINAL_DMG"

          codesign --verify --strict --verbose=2 "$FINAL_DMG"

          xcrun notarytool submit "$FINAL_DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$FINAL_DMG"
          xcrun stapler validate "$FINAL_DMG"

      - name: Create checksums and build information
        shell: bash
        run: |
          set -euo pipefail

          cd "$OUTPUT_DIR"

          FINAL_PKG="Git-${GIT_VERSION}-macOS-Intel.pkg"
          FINAL_DMG="Git-${GIT_VERSION}-macOS-Intel.dmg"

          shasum -a 256 "$FINAL_PKG" > "${FINAL_PKG}.sha256"
          shasum -a 256 "$FINAL_DMG" > "${FINAL_DMG}.sha256"

          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            SIGNING_STATUS="signed-and-notarized"
          else
            SIGNING_STATUS="unsigned"
          fi

          cat > build-information.txt <<EOF
          Git version: ${GIT_VERSION}
          Git tag: ${GIT_TAG}
          Architecture: x86_64
          Deployment target: macOS 13.0
          Signing status: ${SIGNING_STATUS}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          ls -lah

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-${{ needs.version.outputs.git_version }}-macos-intel
          path: |
            ${{ github.workspace }}/output/Git-${{ needs.version.outputs.git_version }}-macOS-Intel.dmg
            ${{ github.workspace }}/output/Git-${{ needs.version.outputs.git_version }}-macOS-Intel.pkg
            ${{ github.workspace }}/output/*.sha256
            ${{ github.workspace }}/output/build-information.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

  release:
    name: Publish GitHub Release
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GIT_VERSION: ${{ needs.version.outputs.git_version }}
      GIT_TAG: ${{ needs.version.outputs.git_tag }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: git-${{ needs.version.outputs.git_version }}-macos-intel
          path: release-files

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail

          SIGNING_STATUS="$(
            grep '^Signing status:' release-files/build-information.txt \
              | cut -d: -f2- \
              | xargs
          )"

          cat > release-notes.md <<EOF
          ## Git ${GIT_VERSION} for Intel Mac

          Built from the official Git tag \`${GIT_TAG}\`.

          - Architecture: Intel x86_64
          - Minimum target: macOS Ventura 13.0
          - Installation path: \`/usr/local/bin/git\`
          - Signing status: ${SIGNING_STATUS}

          Download the DMG, open it, and run the PKG installer inside it.
          SHA-256 checksum files are included.
          EOF

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then

            gh release upload "$RELEASE_TAG" \
              release-files/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Git ${GIT_VERSION} for Intel Mac" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              release-files/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Git ${GIT_VERSION} for Intel Mac" \
              --notes-file release-notes.md
          fi
